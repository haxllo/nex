name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      NEX_WINDOWS_RUNTIME_SMOKE: '1'

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Show toolchain versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version --verbose

      - name: Run Vitest gate
        timeout-minutes: 10
        run: pnpm exec vitest --run

      - name: Run release build gate
        timeout-minutes: 60
        run: cargo build --locked --release --bin Nex --bin NexHelper

      - name: Verify release binaries
        run: |
          test -f target/release/Nex.exe
          test -f target/release/NexHelper.exe

      - name: Run Rust test gate
        timeout-minutes: 60
        run: cargo test --locked -p nex

      - name: Run Rust perf exact gate
        timeout-minutes: 20
        run: cargo test --locked -p nex --test perf_query_latency_test -- --exact warm_query_p95_under_15ms

      - name: Run runtime smoke harness gate
        timeout-minutes: 20
        run: cargo test --locked -p nex --test windows_runtime_smoke_test
