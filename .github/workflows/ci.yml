name: CI

on:
  # Branches run once, on the pull request: that is the gate, and it is the only
  # event that carries the PR body the docs-bypass check reads. Pushing the same
  # branch also fired a second full run on the push event, which doubled the CI
  # minutes and could show one red check next to a green one on the same commit
  # when a flaky test hit only one of them.
  #
  # Master keeps its push run: it is the post-merge verification, and the release
  # notes describe ci.yml as running on every push.
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      NEX_WINDOWS_RUNTIME_SMOKE: '1'

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Linear issue for code changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[].filename' | grep -E '^(apps|scripts|manifests)/' || true)
          if [ -z "$changed" ]; then
            echo "No code-path changes; Linear issue not required."
            exit 0
          fi
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -Eq 'CIQ-[0-9]+'; then
            echo "Linear issue referenced."
            exit 0
          fi
          echo "::error::This PR changes apps/, scripts/, or manifests/ but names no Linear issue (CIQ-<n>) in its title or body."
          exit 1

      - name: Require docs update for behaviour changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          # Escape hatch, so an agent that has genuinely decided a document is
          # unaffected can still land the change. The marker has to be in the PR
          # body, and it has to carry a reason: a bypass with no stated judgment
          # is indistinguishable from an oversight.
          if printf '%s' "$PR_BODY" | grep -q 'NEX_ALLOW_STALE_DOCS'; then
            if printf '%s' "$PR_BODY" | grep -Eq 'NEX_ALLOW_STALE_DOCS=1:[[:space:]]*[^[:space:]]'; then
              echo "PR body carries NEX_ALLOW_STALE_DOCS with a reason; running the gate in bypass mode."
              NEX_ALLOW_STALE_DOCS=1 scripts/check-docs-currency.sh < "$RUNNER_TEMP/changed.txt"
              exit 0
            fi
            echo "::error::The PR body mentions NEX_ALLOW_STALE_DOCS but gives no reason. Write 'NEX_ALLOW_STALE_DOCS=1: <why the document is unaffected>'."
            exit 1
          fi
          scripts/check-docs-currency.sh < "$RUNNER_TEMP/changed.txt"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Show toolchain versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version --verbose

      - name: Run Vitest gate
        timeout-minutes: 10
        run: pnpm exec vitest --run

      - name: Run release build gate
        timeout-minutes: 60
        run: cargo build --locked --release --bin NexUIProcess --bin NexHelper --bin NexIndexerProcess

      - name: Verify release binaries
        run: |
          test -f target/release/NexUIProcess.exe
          test -f target/release/NexHelper.exe
          test -f target/release/NexIndexerProcess.exe

      - name: Run Rust test gate
        timeout-minutes: 60
        run: cargo test --locked -p nex

      - name: Run Rust perf exact gate
        timeout-minutes: 20
        run: cargo test --locked -p nex --test perf_query_latency_test -- --exact warm_query_p95_under_15ms

      - name: Run runtime smoke harness gate
        timeout-minutes: 20
        run: cargo test --locked -p nex --test windows_runtime_smoke_test
