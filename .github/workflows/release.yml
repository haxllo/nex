name: Release

# Publishing a release is: bump the version in all three crates, commit, then
# push a `v<version>` tag. This workflow builds the binaries on the tag, packs
# the zip and the Inno Setup installer, and opens the GitHub release with the
# notes for that version.
#
# It does not re-run the test suite: `ci.yml` already runs on every push, so tag
# a commit that is green on master. If that has to be enforced, make `release`
# a required check on master first.
#
# Signing is skipped. `package-windows-artifact.ps1 -Sign` needs a certificate;
# wire `CERT_PFX_BASE64` / `CERT_PASSWORD` secrets in when one exists, otherwise
# the setup.exe and binaries ship unsigned and SmartScreen warns on them.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches every crate version
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $problems = foreach ($file in 'apps/core/Cargo.toml', 'apps/ui/Cargo.toml', 'apps/indexer/Cargo.toml') {
            $match = Select-String -Path $file -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
            $found = $match.Matches[0].Groups[1].Value
            if ($found -ne $version) { "$file is $found" }
          }
          if ($problems) {
            throw "Tag $tag does not match: $($problems -join '; '). Bump all three crates before tagging."
          }
          Write-Host "Version $version confirmed."
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The What's New view renders a document baked into the binary by
      # apps/core/build.rs, read from this file at compile time. Checking it
      # here, before the build, is deliberate: generating a draft afterwards
      # would leave the shipped binary holding whatever existed when it
      # compiled, which is the tips fallback when the prose was never written.
      # The release notes are the GitHub release body, and are drafted from the
      # commit log when no file for this version exists. This stays before the
      # build on purpose: the run should fail on a broken notes step before it
      # spends an hour compiling.
      #
      # The in-app What's New document is NOT checked here. It is baked into the
      # binary at compile time from docs/whats-new.md, and squeezing a release
      # out without rewriting it is a legitimate choice — the app then shows the
      # text that is committed. Blocking the release on prose would make a
      # five-minute job a hard dependency of shipping a fix.
      - name: Resolve the release notes
        id: notes
        # The generator asks the API for each author's handle, so it needs a token
        # here, not only on the publish step.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $file = "docs/releases/v${env:VERSION}-notes.md"
          if (-not (Test-Path $file)) {
            Write-Host "::warning::No notes at $file. Generating a draft from the commit log."
            pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows/release-notes-from-commits.ps1 -Version $env:VERSION -OutputPath $file
          }
          if (-not (Test-Path $file)) { throw "Release notes are missing and could not be generated." }
          if ([string]::IsNullOrWhiteSpace((Get-Content $file -Raw))) {
            throw "$file is empty; the release page would have no body."
          }
          "path=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # A warning, never a failure. Releasing without rewriting the What's New
      # document is allowed; the shipped app then shows the committed text,
      # which is the previous release's prose if the marker still names it.
      # Saying so loudly is what keeps that from happening quietly.
      - name: Note whether the What's New document is current
        run: |
          $doc = "docs/whats-new.md"
          if (-not (Test-Path $doc)) {
            # Absent is not "skipped this release": the document is committed,
            # so a tree without it is broken. Stale text is a judgement call
            # and only warns; emptiness is a defect and fails the release.
            throw "$doc is missing. It is committed to the repository; restore it from git."
          }
          $raw = Get-Content $doc -Raw
          $match = [regex]::Match($raw, '<!--\s*release:\s*([^\s>-]+)\s*-->')
          if (-not $match.Success) {
            Write-Host "::warning::$doc has no '<!-- release: X -->' marker; cannot tell whether the text matches $env:VERSION."
            exit 0
          }
          if ($match.Groups[1].Value -ne $env:VERSION) {
            Write-Host "::warning::$doc is written for $($match.Groups[1].Value) but this release is $env:VERSION. The app will show the older text."
            exit 0
          }
          $visible = [regex]::Replace($raw, '(?s)<!--.*?-->', '')
          if ([string]::IsNullOrWhiteSpace($visible)) {
            throw "$doc has no text outside its HTML comments; the What's New view would be empty."
          }
          Write-Host "What's New document is current for $env:VERSION."

      - name: Build the release binaries
        timeout-minutes: 60
        run: cargo build --locked --release --bin NexUIProcess --bin NexHelper --bin NexIndexerProcess

      - name: Package the zip and manifest
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows/package-windows-artifact.ps1 -Channel stable

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package the installer
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows/package-windows-installer.ps1 -Channel stable

      - name: Open the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $base = "artifacts/windows/nex-${env:VERSION}-windows-x64"
          foreach ($file in "$base.zip", "$base-setup.exe", "$base-manifest.json") {
            if (-not (Test-Path $file)) { throw "Expected artifact $file was not produced." }
          }
          gh release create $tag `
            --title $tag `
            --notes-file '${{ steps.notes.outputs.path }}' `
            "$base.zip" "$base-setup.exe" "$base-manifest.json"
          Write-Host "Release $tag created."
