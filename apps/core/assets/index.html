<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/style.css" />
    <title>Nex</title>
  </head>
  <body>
    <main id="panel">
      <div id="search-row">
        <svg id="search-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          id="query"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Search for apps, files and actions…"
        />
        <button id="help" title="Open config" aria-label="Open config">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7"></path>
            <line x1="12" y1="17" x2="12" y2="17"></line>
          </svg>
        </button>
        <div id="power-wrap-top" class="hidden">
          <button type="button" id="power-btn-top" title="Power options" aria-label="Power options">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v10" />
              <path d="M18.4 6.6a9 9 0 1 1-12.8 0" />
            </svg>
          </button>
        </div>
      </div>

      <div id="body" class="idle">
        <div id="divider"></div>
        <ul id="list" role="listbox"></ul>
        <div id="status" class="hidden"></div>
      </div>

      <footer id="footer">
        <div class="hints">
          <div class="hint"><span class="kbd">↵</span><span class="lbl">Open</span></div>
          <span class="dot">·</span>
          <div class="hint"><span class="kbd">↑</span><span class="kbd">↓</span><span class="lbl">Move</span></div>
          <span class="dot">·</span>
          <div class="hint"><span class="kbd">esc</span><span class="lbl">Close</span></div>
        </div>
        <div id="power-wrap">
          <button type="button" id="power-btn" title="Power options" aria-label="Power options">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v10" />
              <path d="M18.4 6.6a9 9 0 1 1-12.8 0" />
            </svg>
          </button>
          <div id="power-menu" class="hidden">
            <button type="button" data-power="lock">Lock</button>
            <button type="button" data-power="sleep">Sleep</button>
            <hr />
            <button type="button" data-power="shutdown">Shutdown</button>
            <button type="button" data-power="restart">Restart</button>
            <hr />
            <button type="button" data-power="signout">Sign Out</button>
          </div>
          <div id="power-confirm" class="hidden">
            <div class="confirm-title" id="power-confirm-title">Restart now?</div>
            <hr />
            <button type="button" class="confirm-yes" id="power-confirm-yes">Restart</button>
            <button type="button" data-confirm="no">Cancel</button>
          </div>
        </div>
      </footer>
    </main>
    <div id="context-menu" class="hidden">
      <button type="button" data-action="open">Open</button>
      <button type="button" data-action="runas">Run as Administrator</button>
      <button type="button" data-action="openfolder">Open File Location</button>
      <button type="button" data-action="copypath">Copy Path</button>
      <hr />
      <button type="button" data-action="pin">Pin to Quick Launch</button>
      <hr />
      <button type="button" data-action="uninstall">Uninstall</button>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
