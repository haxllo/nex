<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/style.css" />
    <title>Nex</title>
  </head>
  <body>
    <main id="panel">
      <div id="search-row">
        <svg id="search-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <div id="query-wrap">
          <span id="completion" aria-hidden="true"></span>
          <input
            id="query"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Search apps, files and actions"
            placeholder="Search for apps, files and actions…"
          />
        </div>
        <div id="power-wrap-top">
          <button type="button" id="power-btn-top" title="Power options" aria-label="Power options">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v10" />
              <path d="M18.4 6.6a9 9 0 1 1-12.8 0" />
            </svg>
          </button>
        </div>
        <div id="update-notice" class="hidden">
          <button type="button" id="update-btn" title="Update available" aria-label="Update available">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <span>Update</span>
          </button>
        </div>
      </div>

      <div id="power-panel-top" class="power-panel hidden">
        <div id="power-menu-top" class="power-row">
          <button type="button" class="pcircle" data-power="back"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg><span>Back</span></button>
          <button type="button" class="pcircle" style="--c:var(--lock)" data-power="lock"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Lock</span></button>
          <button type="button" class="pcircle" style="--c:var(--logout)" data-power="signout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Log Out</span></button>
          <button type="button" class="pcircle" style="--c:var(--sleep)" data-power="sleep"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span>Sleep</span></button>
          <button type="button" class="pcircle" style="--c:var(--restart)" data-power="restart"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg><span>Restart</span></button>
          <button type="button" class="pcircle" style="--c:var(--shutdown)" data-power="shutdown"><svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg><span>Shut Down</span></button>
        </div>
        <div id="power-confirm-top" class="power-confirm hidden">
          <div class="confirm-title" id="power-confirm-title-top">Restart now?</div>
          <div class="power-row">
            <button type="button" class="pcircle" id="power-confirm-yes-top" data-confirm="yes"><svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg><span>Restart</span></button>
            <button type="button" class="pcircle" id="power-confirm-cancel-top" data-confirm="no"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span>Cancel</span></button>
          </div>
        </div>
      </div>

      <div id="body" class="idle">
        <div id="divider"></div>
        <ul id="list" role="listbox" aria-label="Search results" tabindex="-1"></ul>
        <div id="status" class="hidden"></div>
      </div>

      <div id="media-view" aria-label="Now playing">
        <div id="media-dots" class="hidden" role="tablist" aria-label="Media sources"></div>
        <img id="media-art" alt="" />
        <div class="media-main">
          <div id="media-title" class="media-title">Nothing playing</div>
          <div id="media-artist" class="media-artist"></div>
          <div id="media-progress"><div id="media-progress-fill"></div><div id="media-progress-knob"></div></div>
          <div class="media-times"><span id="media-pos">0:00</span><span class="media-times-right"><span id="media-live" class="hidden">LIVE</span><span id="media-dur">0:00</span></span></div>
          <div class="media-controls">
            <button type="button" id="media-prev" title="Previous" aria-label="Previous track">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
            </button>
            <button type="button" id="media-toggle" title="Play/Pause" aria-label="Play or pause">
              <svg id="media-play-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg id="media-pause-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="hidden"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>
            <button type="button" id="media-next" title="Next" aria-label="Next track">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
            </button>
            <span class="media-volume-inline hidden" id="media-volume-inline">
              <button type="button" id="media-mute" title="Mute" aria-label="Mute or unmute">
                <svg id="media-vol-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                <svg id="media-mute-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="hidden"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
              </button>
              <input type="range" id="media-volume-slider" min="0" max="100" step="1" value="100" aria-label="Volume" />
            </span>
          </div>
        </div>
      </div>

      <div id="whats-new-view" aria-label="What's new">
        <div class="whats-new-eyebrow">What's new</div>
        <div class="whats-new-title" id="whats-new-title">Nex updated</div>
        <div class="whats-new-items" id="whats-new-items"></div>
        <div class="whats-new-tips" id="whats-new-tips"></div>
        <button type="button" id="whats-new-dismiss">Got it</button>
      </div>

      <div id="power-panel" class="power-panel hidden">
        <div id="power-menu" class="power-row">
          <button type="button" class="pcircle" data-power="back"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg><span>Back</span></button>
          <button type="button" class="pcircle" style="--c:var(--lock)" data-power="lock"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Lock</span></button>
          <button type="button" class="pcircle" style="--c:var(--logout)" data-power="signout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Log Out</span></button>
          <button type="button" class="pcircle" style="--c:var(--sleep)" data-power="sleep"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span>Sleep</span></button>
          <button type="button" class="pcircle" style="--c:var(--restart)" data-power="restart"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg><span>Restart</span></button>
          <button type="button" class="pcircle" style="--c:var(--shutdown)" data-power="shutdown"><svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg><span>Shut Down</span></button>
        </div>
        <div id="power-confirm" class="power-confirm hidden">
          <div class="confirm-title" id="power-confirm-title">Restart now?</div>
          <div class="power-row">
            <button type="button" class="pcircle" id="power-confirm-yes" data-confirm="yes"><svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg><span>Restart</span></button>
            <button type="button" class="pcircle" id="power-confirm-cancel" data-confirm="no"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span>Cancel</span></button>
          </div>
        </div>
      </div>

      <footer id="footer">
        <div class="hints">
          <div class="hint"><span class="kbd">↵</span><span class="lbl">Open</span></div>
          <div class="hint hidden" id="hint-complete"><span class="kbd">tab</span><span class="lbl">Complete</span></div>
          <div class="hint"><span class="kbd">esc</span><span class="lbl">Close</span></div>
        </div>
        <button type="button" class="footer-settings" id="footer-settings-btn" title="Settings">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="2.5"/>
            <path d="M13.2 10a1.2 1.2 0 0 0 .2 1.3l.05.05a1.44 1.44 0 1 1-2.04 2.04l-.05-.05a1.2 1.2 0 0 0-1.3-.2 1.2 1.2 0 0 0-.72 1.08v.12a1.44 1.44 0 0 1-2.88 0v-.06a1.2 1.2 0 0 0-.78-1.08 1.2 1.2 0 0 0-1.3.2l-.05.05a1.44 1.44 0 1 1-2.04-2.04l.05-.05a1.2 1.2 0 0 0 .2-1.3 1.2 1.2 0 0 0-1.08-.72h-.12a1.44 1.44 0 0 1 0-2.88h.06a1.2 1.2 0 0 0 1.08-.78 1.2 1.2 0 0 0-.2-1.3l-.05-.05A1.44 1.44 0 1 1 4.86 2.6l.05.05a1.2 1.2 0 0 0 1.3.2h.06a1.2 1.2 0 0 0 .72-1.08v-.12a1.44 1.44 0 0 1 2.88 0v.06a1.2 1.2 0 0 0 .72 1.08 1.2 1.2 0 0 0 1.3-.2l.05-.05a1.44 1.44 0 1 1 2.04 2.04l-.05.05a1.2 1.2 0 0 0-.2 1.3v.06a1.2 1.2 0 0 0 1.08.72h.12a1.44 1.44 0 0 1 0 2.88h-.06a1.2 1.2 0 0 0-1.08.72z"/>
          </svg>
        </button>
      </footer>
    </main>
    <div id="context-menu" class="hidden">
      <button type="button" data-action="open">Open</button>
      <button type="button" data-action="runas">Run as Administrator</button>
      <button type="button" data-action="openfolder">Open File Location</button>
      <button type="button" data-action="copypath">Copy Path</button>
      <hr data-divider="1" />
      <button type="button" data-action="pin">Pin to Quick Launch</button>
      <hr data-divider="2" />
      <button type="button" data-action="uninstall">Uninstall</button>
    </div>
    <script src="/media_clock.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
