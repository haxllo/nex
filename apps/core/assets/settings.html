<!DOCTYPE html>
<html lang="en">
    <head><meta charset="UTF-8"><style>
        :root { --sbg:#1e1e1e; --sfg:#dddddd; --smut:#888888; --sbin:#2a2a2a; --sbinb:#444444; }
        html[data-theme="light"] { --sbg:#f6f6f8; --sfg:#16161a; --smut:#77777d; --sbin:#ffffff; --sbinb:#cccccc; }
        body {
            font-family: "Segoe UI", sans-serif;
            background: var(--sbg);
            color: var(--sfg);
            padding: 24px;
        }
        input {
            width: 300px;
            padding: 6px;
            background: var(--sbin);
            color: var(--sfg);
            border: 1px solid var(--sbinb);
            border-radius: 4px;
        }
        button {
            padding: 6px 14px;
            margin-left: 8px;
            cursor: pointer;
        }
        #status {
            margin-top: 12px;
            color: var(--smut);
            font-size: 12px;
        }
        .row { 
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            color: var(--smut);
            font-size: 12px; 
        }
        input[type="number"], input[type="text"] 
        {
            width: 220px; 
        }
    </style></head>
<body>
    <h3>Nex Settings</h3>

    <div class="row">
        <label><input type="checkbox" id="gridView"/> Show Grid View</label>
    </div>
    <div class="row">
        <label><input type="checkbox" id="quickLaunchEnabled"/> Enable Quick Launch</label>
    </div>

    <div class="row">
        <label>Max results (5-100)</label>
        <input type="number" id="maxResults" min="5" max="100"/>
    </div>
    <div class="row">
        <label>Quick Launch Max Items</label>
        <input type="number" id="quickLaunchMaxItems" min="3" max="12"/>
    </div>
    <div class="row">
        <label>Index size cap (10k–2M)</label>
        <input type="number" id="indexMaxItemsTotal" min="10000" max="200000"/>
    </div>
    <div class="row">
        <label>Hotkey</label>
        <input type="text" id="hotkey" />
    </div>
    <button onclick="save(); this.blur()">Save</button>
    <div id="status"></div>
    <script src="/settings.js"></script>
</body>
</html>
