<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #1a1a1e;
    --surface: #232328;
    --border: #2e2e35;
    --fg: #e4e4e8;
    --mut: #8a8a95;
    --accent: #5b8af5;
    --input-bg: #1a1a1e;
    --input-border: #3a3a42;
    --danger: #e05a4e;
  }
  html[data-theme="light"] {
    --bg: #f4f4f7;
    --surface: #ffffff;
    --border: #e0e0e5;
    --fg: #1a1a1e;
    --mut: #6e6e7a;
    --accent: #3567d4;
    --input-bg: #f4f4f7;
    --input-border: #d0d0d8;
    --danger: #d4463a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 20px 24px;
    font-size: 13px;
    line-height: 1.5;
  }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* ── Sections ── */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--mut);
    margin-bottom: 14px;
  }

  /* ── Rows ── */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 0;
  }
  .row + .row { border-top: 1px solid var(--border); }
  .row-label {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex: 1;
    min-width: 0;
  }
  .row-label span { font-weight: 500; font-size: 13px; }
  .row-label small { color: var(--mut); font-size: 11px; }
  .row-control { flex-shrink: 0; margin-left: 14px; }

  /* ── Inputs ── */
  input[type="number"], input[type="text"] {
    width: 90px;
    padding: 5px 8px;
    background: var(--input-bg);
    color: var(--fg);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    text-align: right;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="number"]:focus, input[type="text"]:focus {
    border-color: var(--accent);
  }

  /* ── Toggle ── */
  .toggle {
    position: relative;
    width: 36px;
    height: 20px;
    cursor: pointer;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .slider {
    position: absolute;
    inset: 0;
    background: var(--input-border);
    border-radius: 20px;
    transition: background 0.2s;
  }
  .toggle .slider::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle input:checked + .slider { background: var(--accent); }
  .toggle input:checked + .slider::after { transform: translateX(16px); }

  /* ── Hotkey box ── */
  .hkbox {
    display: inline-flex;
    align-items: center;
    padding: 5px 12px;
    min-width: 110px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s, color 0.15s;
  }
  .hkbox:hover { border-color: var(--accent); }
  .hkbox.recording {
    border-color: var(--danger);
    color: var(--danger);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* ── Footer ── */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .status { color: var(--mut); font-size: 12px; }
  .status.error { color: var(--danger); }
  .btn-save {
    padding: 7px 22px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-save:hover { opacity: 0.9; }
  .btn-save:active { opacity: 0.8; }
</style>
</head>
<body>

<div class="grid">

  <!-- Left Column -->
  <div class="section">
    <div class="section-title">General</div>
    <div class="row">
      <div class="row-label">
        <span>Grid View</span>
        <small>Show results in a grid layout</small>
      </div>
      <label class="toggle row-control">
        <input type="checkbox" id="gridView"/>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Quick Launch</div>
    <div class="row">
      <div class="row-label">
        <span>Enable</span>
        <small>Show pinned apps when overlay opens</small>
      </div>
      <label class="toggle row-control">
        <input type="checkbox" id="quickLaunchEnabled"/>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <div class="row-label">
        <span>Max Items</span>
        <small>Items to display (3–12)</small>
      </div>
      <input type="number" id="quickLaunchMaxItems" min="3" max="12" class="row-control"/>
    </div>
  </div>

  <!-- Right Column -->
  <div class="section">
    <div class="section-title">Search</div>
    <div class="row">
      <div class="row-label">
        <span>Max Results</span>
        <small>Results per query (5–100)</small>
      </div>
      <input type="number" id="maxResults" min="5" max="100" class="row-control"/>
    </div>
    <div class="row">
      <div class="row-label">
        <span>Index Size Cap</span>
        <small>Maximum items indexed</small>
      </div>
      <input type="number" id="indexMaxItemsTotal" min="10000" max="2000000" class="row-control"/>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Hotkey</div>
    <div class="row">
      <div class="row-label">
        <span>Toggle Shortcut</span>
        <small>Click, then press your combo</small>
      </div>
      <div class="hkbox" id="hotkeyBox" tabindex="0"></div>
    </div>
  </div>

</div>

<div class="footer">
  <span id="status" class="status"></span>
  <button class="btn-save" onclick="save(); this.blur()">Save</button>
</div>

<script src="/settings.js"></script>
</body>
</html>
