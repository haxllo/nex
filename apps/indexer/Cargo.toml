[package]
name = "nex-indexer"
version = "2.39.0"
edition = "2024"
authors = ["haxllo"]
description = "Background indexing process for Nex"
license = "MIT"
repository = "https://github.com/haxllo/nex"

[[bin]]
name = "NexIndexerProcess"
path = "src/main.rs"

[dependencies]
nex = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

[dev-dependencies]
serde_json = "1.0.145"

[build-dependencies]
winres = "0.1"
